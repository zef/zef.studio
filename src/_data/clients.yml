- name: "About Me"
  icons:
    - image: "swift.png"
      name: ""
      link: "https://swift.org"
  description: |
    Hello! My name is Zef, and I'm passionate about creating excellent software.
    
    I've been working as a freelance software engineer since 2007, and my
    software has been used by millions of people around the world. I seek to
    deliver excellent value by providing great code, team leadership, and
    insight in design, user-experience, and business value.
    
    In addition to working with code, I'm great at working with clients and
    designers. I am skilled in clear communication with people from all
    backgrounds.
    
    [Download my Resume](/portfolio/zef-houssney-resume.pdf) to learn about my
    specific skills, check out some of my work on
    [GitHub](https://github.com/zef), and write me at
    [zef@zef.studio](mailto:zef@zef.studio).
    
    I specialize in native iOS application development, but I also have
    extensive experience with and knowledge of web development, which informs my
    work and helps me to be a great iOS developer, too.
    
    Here's a selection of some of the iOS work I've done for clients.

- name: "Disney Movies Anywhere"
  icons:
    - image: "disney-movies-anywhere.png"
      name: "Disney Movies Anywhere"
      link: "https://en.wikipedia.org/wiki/Movies_Anywhere"
  description: |
    On Disney Movies Anywhere, I worked on a small team to build and architect
    this high-profile application from scratch, and on a tight timeline. I
    interacted with Disney APIs, integrating internal and third-party libraries.
    I also worked with Apple on our system-level iTunes account linking feature.
    
    We shipped a great app on time, and I continued to work on it throughout its
    entire lifetime — eventually taking over leadership of the iOS team — until
    it was replaced by Movies Anywhere in 2017, and then eventually retired.

- name: "Movies Anywhere"
  icons:
    - image: "movies-anywhere.png"
      name: "Movies Anywhere"
      link: "https://apps.apple.com/us/app/movies-anywhere/id1245330908"
  description: |
    I worked with and helped lead a small team to build [Movies
    Anywhere](https://moviesanywhere.com) from scratch. Worked with backend
    teams and frontend teams for other platforms to determine approaches for the
    architecture of app and server interaction.
    Conceptualized and implemented iOS architecture, which included the use of
    GraphQL and the Realm database.
    
    We launched into a high traffic environment, yet maintained an extremely low
    crash rate from launch day forward. I continued to work with the team at
    Movies Anywhere after launch, eventually interviewing, hiring, and
    onboarding new team members as the team transitioned to only full-time,
    on-site employees.
    
    When wrapping up this project, my good friend Aaron said something really
    nice about me:

    <blockquote class="twitter-tweet" data-theme="light"><p lang="en" dir="ltr">Between you and me, Zef’s game is the tightest I’ve seen. You want the best, you get Zef. <a href="https://t.co/Tr0r7S9DTH">https://t.co/Tr0r7S9DTH</a></p>&mdash; Aaron Vegh (@🏡) (@aaronvegh) <a href="https://twitter.com/aaronvegh/status/959263590028070913?ref_src=twsrc%5Etfw">February 2, 2018</a></blockquote> <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

- name: "Fitz Frames"
  icons:
    - image: "fitz-frames.png"
      name: "Fitz Frames"
      link: "https://apps.apple.com/us/app/fitz-glasses/id1451230309"
  description: |
    I was brought in to lead a team of developers in creating a solid foundation
    for the [Fitz Frames](https://www.fitzframes.com) iOS app.
    
    A key part of this app was the use of ARKit and other iOS Vision libraries
    to facilitate virtual try-on, and to measure facial features of children in
    order to create perfectly-fitting custom glasses. After the conclusion of my
    contract, the team went on to successfully launch the app.

- name: "Planetary"
  icons:
    - image: "planetary.png"
      name: "Planetary"
      link: "https://planetary.social"
  description: |
    [Planetary](https://planetary.social) — currently in beta — is a
    new social network built on a distributed, open foundation. I came in to
    help accelerate the development of the app by lending a hand to the solo
    developer who had started the project. My primary goal was to refine and to
    improve polish in the app, fixing bugs along the way.
    
    I also got to implement a fun custom dynamic animation of the icon in their
    logo for use as a connectivity indicator inside the app. The number of balls
    on each of the circles is dynamic, indicating the number of connected peers,
    spinning, changing color to represent connection state, and smoothly
    animating changes to the real data.
    
    This code has been [open
    sourced](https://github.com/planetary-social/planetary-ios/).  Although the
    git history was reset when the project was made public, doing a search for
    [my name](https://github.com/planetary-social/planetary-ios/search?q=zef)
    reveals the files I created while working on the project.

